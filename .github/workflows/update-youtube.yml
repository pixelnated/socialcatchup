name: Update YouTube Results

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: update-youtube-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch latest YouTube results and build pages
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain data/youtube_latest.json data/youtube_playlists_latest.json docs/index.html docs/youtube.html docs/playlists.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/youtube_latest.json data/youtube_playlists_latest.json docs/index.html docs/youtube.html docs/playlists.html
            git commit -m "chore: refresh YouTube results and playlists"
            git push
          else
            echo "No changes to commit"
          fi
